name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Use locked npm CLI
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck application and tests
        run: npm run check

      - name: Lint source, tests, and QA scripts
        run: npm run lint

      - name: Validate fixture parity
        run: npm run check:fixtures

      - name: Validate repository metadata
        run: npm run check:metadata

      - name: Run unit and runtime-contract tests with coverage
        run: npm run test:coverage

      - name: Build testable production bundle
        run: npm run build:test

      - name: Enforce bundle budgets
        run: npm run check:bundle

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Upload unit coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage-${{ github.run_attempt }}
          path: app/coverage
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser fixtures and local workflow
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Use locked npm CLI
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run EN/FR desktop and mobile journeys
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics-${{ github.run_attempt }}
          path: |
            app/playwright-report
            app/test-results
          if-no-files-found: ignore
          retention-days: 7

  edge-function:
    name: Edge checks (${{ matrix.function }})
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        function: [analyze-seed, capture-source]
    defaults:
      run:
        working-directory: supabase/functions/${{ matrix.function }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: 2.9.6
          cache: true

      - name: Restore frozen Edge dependencies
        run: deno ci

      - name: Check Edge formatting
        run: deno fmt --check .

      - name: Lint Edge Function
        run: deno lint .

      - name: Typecheck Edge Function
        run: deno task check

      - name: Test Edge Function
        run: deno task test

      - name: Verify Edge lockfile stayed frozen
        run: git diff --exit-code -- deno.lock

  supabase:
    name: Disposable Supabase integration
    needs: edge-function
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Use locked npm CLI
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"

      - name: Install locked frontend and browser dependencies
        run: npm --prefix app ci

      - name: Install Chromium runtime
        run: npm --prefix app exec -- playwright install --with-deps chromium

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.75.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Start disposable Supabase stack
        run: supabase start

      - name: Reapply migrations and local seed
        run: supabase db reset --local --yes

      - name: Export disposable browser test environment
        shell: bash
        run: |
          set -euo pipefail
          status_json="$(supabase status --output json)"
          api_url="$(jq -er '.API_URL // .api_url' <<<"${status_json}")"
          anon_key="$(jq -er '.PUBLISHABLE_KEY // .publishable_key // .ANON_KEY // .anon_key' <<<"${status_json}")"
          service_key="$(jq -er '.SECRET_KEY // .secret_key // .SERVICE_ROLE_KEY // .service_role_key' <<<"${status_json}")"
          echo "::add-mask::${service_key}"
          {
            echo "VITE_SUPABASE_URL=${api_url}"
            echo "VITE_SUPABASE_ANON_KEY=${anon_key}"
            echo "PLAYWRIGHT_SUPABASE_URL=${api_url}"
            echo "PLAYWRIGHT_SUPABASE_ANON_KEY=${anon_key}"
            echo "PLAYWRIGHT_SUPABASE_SERVICE_ROLE_KEY=${service_key}"
          } >> "${GITHUB_ENV}"

      - name: Run RLS and authorization matrix
        run: npm --prefix app run test:rls

      - name: Smoke authenticated deterministic analysis
        run: npm --prefix app run test:supabase:smoke

      - name: Lint database functions
        run: >-
          supabase db lint
          --local
          --schema public,private
          --level warning
          --fail-on error

      - name: Run authenticated multi-role dossier journey
        run: npm --prefix app run test:e2e:backend

      - name: Upload backend Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-playwright-diagnostics-${{ github.run_attempt }}
          path: |
            app/playwright-report/backend
            app/test-results/backend
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove disposable Supabase stack
        if: ${{ always() }}
        run: supabase stop --no-backup || true
