<!doctype html>
<!-- The build replaces the shell with route-specific French and English HTML. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-pxh="1">Parallax — L'atlas du désaccord</title>
    <meta name="description" data-pxh="1" content="Parallax makes disagreement inspectable. Every serious position at its strongest, every claim tied to its sources, every value named. No winners declared." />
    <meta name="theme-color" content="#eef1f4" />
    <meta name="color-scheme" content="light" />

    <!-- Canonical / social. These localhost values make the raw development
         shell safe. Every deployable build must provide SITE_ORIGIN and
         VITE_SITE_ORIGIN; prerender rewrites every data-pxh tag per route. -->
    <link rel="canonical" href="http://127.0.0.1:5173/" data-pxh="1" />

    <meta property="og:site_name" content="Parallax" />
    <meta property="og:title" data-pxh="1" content="Parallax — L'atlas du désaccord" />
    <meta property="og:description" data-pxh="1" content="Parallax lays each debate out flat — positions, evidence, values, trade-offs — so you can see why people actually disagree." />
    <meta property="og:type" data-pxh="1" content="website" />
    <meta property="og:url" data-pxh="1" content="http://127.0.0.1:5173/" />
    <meta property="og:locale" data-pxh="1" content="fr_FR" />
    <meta property="og:locale:alternate" data-pxh="1" content="en_US" />
    <meta property="og:image" data-pxh="1" content="http://127.0.0.1:5173/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Parallax — the atlas of disagreement. Two offset circles, petrol and ember on a blueprint ground." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" data-pxh="1" content="Parallax — L'atlas du désaccord" />
    <meta name="twitter:description" data-pxh="1" content="Understand every view — including your own. Every claim tied to its sources, every value named. No winners declared." />
    <meta name="twitter:image" data-pxh="1" content="http://127.0.0.1:5173/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Parallax — the atlas of disagreement. Two offset circles, petrol and ember on a blueprint ground."
    />

    <!-- Identity mark: oxide filled circle + paper-stroked outline circle on ink,
         inlined as a data: URI so there is no network round-trip and no 404. Add
         raster icons (favicon-16/-32.png, apple-touch-icon.png) + site.webmanifest
         to app/public and re-link them here once that art is produced — until then
         we ship ONLY the inline SVG so nothing dangles. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316202b'/%3E%3Ccircle cx='37' cy='32' r='13' fill='%230e6b7a'/%3E%3Ccircle cx='26' cy='32' r='13' fill='none' stroke='%239a4a12' stroke-width='3'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
