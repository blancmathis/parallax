name: Bug report
description: Report a reproducible product or development problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private data, or vulnerability details.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
      placeholder: main, deployed URL, or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add logs or screenshots only when they contain no private data.
